# AI PR review with OpenCodeReview (alibaba/open-code-review, Apache-2.0): inline comments + sticky summary.
# Copy to <project>/.github/workflows/review.yml. Optional — costs model credits per PR.
# Settings → Secrets and variables → Actions:
#   secret OCR_LLM_URL · secret OCR_LLM_AUTH_TOKEN · variable OCR_LLM_MODEL · variable OCR_LLM_USE_ANTHROPIC ('true' for Claude)
# Re-review on demand: comment `/open-code-review` (members/owners/collaborators only).
# Pin `@main` to a release commit SHA + `ocr_version` for reproducible runs.
name: review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request && github.event.comment.user.type != 'Bot'
          && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
          && startsWith(github.event.comment.body, '/open-code-review'))
    steps:
      - name: Resolve PR refs (comment trigger)
        id: pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.setOutput('base_ref', pr.base.ref); core.setOutput('head_sha', pr.head.sha);
      - uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
