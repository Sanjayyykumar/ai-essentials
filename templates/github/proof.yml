name: check
# Drop into <project>/.github/workflows/. Proves the project's own build + tests (P0-P2).
# Needs scripts/verify.py from AI Essentials: copy it to <project>/scripts/verify.py (one file, no deps).
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Uncomment what the project uses so its tests can run:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22, cache: npm }
      # - run: npm ci
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: 21, cache: maven }
      # - run: pip install -r requirements.txt pytest
      - name: P0-P2 proof
        run: python scripts/verify.py --project .
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: proof, path: .proof/verify.json, if-no-files-found: ignore }
